<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Register | Carbon Credit Trading System</title><link rel="stylesheet" href="css/style.css"></head>
<body><nav class="nav"><div class="nav-inner"><a class="logo" href="index.html">Carbon<span>Trade</span></a>
<div class="nav-links"><a href="login.html">Company Login</a><a href="register.html">Register</a><a href="admin/dashboard.html">Admin</a></div></div></nav>
<main class="container"><div class="form-card"><div class="eyebrow">New Company</div><h1>Register Company</h1>
<p>This form matches the inputs collected by your Java registration method.</p>
<form id="registerForm">
<label>Company Name</label><input name="name" required>
<label>Domain</label><select name="domain" required><option value="">Select domain</option><option>MANUFACTURING</option><option>ENERGY</option><option>TRANSPORT</option><option>IT</option><option>AGRICULTURE</option></select>
<label>Employees</label><input name="employees" type="number" min="1" required>
<label>Password</label><input name="password" type="password" minlength="4" required>
<div class="form-row"><div><label>Email (optional)</label><input name="email" type="email"></div><div><label>Phone (optional)</label><input name="phone"></div></div>
<button class="btn full">Register Company</button></form>
<div id="success" class="note" style="display:none"></div></div></main>
<script src="js/app.js"></script></body></html>
